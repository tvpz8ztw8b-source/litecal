<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F7F6">
  <title>轻卡星球 LiteCal · 极简健身打卡</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <div class="app">
    <!-- 状态栏（模拟小程序胶囊栏上方系统状态） -->
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">
        <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
        <svg viewBox="0 0 24 12" width="22" height="12" fill="none" stroke="currentColor"><rect x="1" y="1" width="18" height="10" rx="3" stroke-width="1.4"/><rect x="3" y="3" width="12" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M21 4.5v3" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
    </div>

    <!-- 应用头 -->
    <header class="app-header">
      <div class="header-left">
        <div class="page-title" id="pageTitle">轻卡星球</div>
        <div class="header-sub" id="pageSub"></div>
      </div>
    </header>

    <!-- 视图槽（四大模块由 app.js 渲染） -->
    <main class="view" id="view"></main>
  </div>

  <!-- 底部导航（JS 注入，冻结 4 项） -->
  <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>

  <!-- 语境化悬浮录入按钮 -->
  <button class="fab" id="fab" data-action="fab" aria-label="快速录入"></button>

  <!-- 底部弹层 -->
  <div class="sheet-mask" id="sheetMask" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

  <!-- 轻提示 -->
  <div class="toast" id="toast" role="status"></div>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
